<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — Lumen</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        color: #f5f4f1;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .wrap {
        max-width: 360px;
      }
      .ring {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 999px;
        border: 1.5px solid rgba(227, 168, 87, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #e3a857;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 8px;
      }
      p {
        color: #a8a7ad;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #e3a857;
        color: #1a1305;
        border: none;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ring"><span class="dot"></span></div>
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use. Downloaded tracks in your library will still play.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
