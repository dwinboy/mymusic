<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline — Vibe Banger</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0b;
        color: #f5f4f1;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .wrap {
        max-width: 360px;
      }
      /* The service worker caches this icon as part of the app shell, so the
         mark still draws with no connection. */
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 14px;
        display: block;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 8px;
      }
      p {
        color: #a8a7ad;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .primary,
      button {
        display: block;
        border-radius: 999px;
        padding: 13px 20px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: #e3a857;
        color: #1a1305;
      }
      button {
        background: transparent;
        color: #f5f4f1;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="mark" src="/icons/icon-192.png" alt="Vibe Banger" width="64" height="64" />
      <h1>You're offline</h1>
      <p>This page needs a connection. Songs you've downloaded still play.</p>
      <div class="actions">
        <a class="primary" href="/downloads">Open downloads</a>
        <button onclick="location.reload()">Try again</button>
      </div>
    </div>
  </body>
</html>
